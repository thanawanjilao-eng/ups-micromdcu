<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบริหารจัดการ UPS หลายห้องปฏิบัติการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F7FAF7; --surface:#FFFFFF; --surface-2:#EEF6EE; --ink:#1B2A1E; --ink-soft:#5E6E5F;
    --line:#DCEBDD; --brand:#2F7D4F; --brand-dark:#1F5C38; --gold:#7CB342;
    --red:#C6444B; --red-bg:#FCEBEC; --yellow:#B8863A; --yellow-bg:#FBF3E3; --green:#2F7D4F; --green-bg:#E5F3E8;
    --mono:'JetBrains Mono',monospace; --sans:'Sarabun',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--gold);color:#fff;}

  .shell{display:flex;min-height:100vh;}
  .sidebar{width:246px;flex-shrink:0;background:var(--brand-dark);color:#EAF2F4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 4px;}
  .brand h1{font-size:17px;margin:0;font-weight:600;line-height:1.3;}
  .brand .sub{font-size:11.5px;color:#9FB6BE;margin-top:4px;}

  .lab-switch{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
  .lab-switch label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#9FB6BE;display:block;margin-bottom:6px;}
  .lab-switch select{width:100%;padding:8px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#EAF2F4;font-family:var(--sans);font-size:13px;}
  .lab-switch select option{color:#16252C;}

  nav{padding:12px 10px;flex:0 0 auto;}
  .nav-btn{width:100%;text-align:right;background:none;border:none;color:#CFE1E6;font-family:var(--sans);font-size:14.5px;padding:10px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:3px;transition:background .15s ease,color .15s ease;}
  .nav-btn .lbl{display:flex;align-items:center;gap:10px;}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-btn.active{background:var(--gold);color:#2A2107;font-weight:600;}
  .nav-badge{font-family:var(--mono);font-size:11px;background:var(--red);color:#fff;border-radius:20px;padding:1px 8px;min-width:20px;text-align:center;}
  .nav-btn.active .nav-badge{background:#2A2107;color:var(--gold);}

  .auth-panel{margin-top:auto;padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#AFC5CB;}
  .auth-role{font-size:12.5px;color:#EAF2F4;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .auth-role .role-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .auth-btn{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#EAF2F4;padding:8px 10px;border-radius:7px;font-family:var(--sans);font-size:12.5px;cursor:pointer;}
  .auth-btn:hover{background:rgba(255,255,255,.16);}

  .main{flex:1;min-width:0;padding:28px 34px 60px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h2{font-size:24px;margin:0 0 4px;font-weight:600;}
  .page-head p{margin:0;color:var(--ink-soft);font-size:14px;}

  .btn{font-family:var(--sans);font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s ease;}
  .btn:hover{border-color:var(--brand);color:var(--brand);}
  .btn-primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn-primary:hover{background:var(--brand-dark);color:#fff;}
  .btn-gold{background:var(--gold);color:#2A2107;border-color:var(--gold);font-weight:600;}
  .btn-gold:hover{filter:brightness(1.05);color:#2A2107;}
  .btn-danger{color:var(--red);}
  .btn-danger:hover{border-color:var(--red);background:var(--red-bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .badge-view{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:4px 10px;border-radius:20px;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--brand));}
  .kpi .num{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1;}
  .kpi .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}

  .map-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
  .map-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .map-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .map-toolbar .legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .map-canvas{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:linear-gradient(rgba(11,79,108,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(11,79,108,.06) 1px, transparent 1px),var(--surface-2);background-size:5% 5%;border:1px dashed var(--line);background-position:center;background-repeat:no-repeat,no-repeat,no-repeat;}
  .map-canvas.has-bg{background-size:5% 5%, 5% 5%, cover;}
  .map-empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;text-align:center;padding:20px;pointer-events:none;}
  .pin{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .pin.draggable{cursor:grab;}
  .pin.draggable:active{cursor:grabbing;}
  .pin::after{content:'';width:7px;height:7px;background:#fff;border-radius:50%;transform:rotate(45deg);}
  .pin.selected{outline:2px solid var(--gold);outline-offset:2px;}
  .pin-tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(45deg);font-family:var(--mono);font-size:10px;background:var(--brand-dark);color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none;}
  .pin:hover .pin-tag{opacity:1;}

  .detail-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:200px;}
  .detail-card h3{margin:0 0 2px;font-size:16px;font-family:var(--mono);}
  .detail-card .risk-chip{margin:6px 0 12px;}
  .detail-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);gap:10px;}
  .detail-row .k{color:var(--ink-soft);flex-shrink:0;}
  .detail-row .v{font-weight:500;text-align:right;}
  .detail-empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:50px 10px;}

  .risk-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
  .risk-red{background:var(--red-bg);color:var(--red);}
  .risk-yellow{background:var(--yellow-bg);color:var(--yellow);}
  .risk-green{background:var(--green-bg);color:var(--green);}

  .lab-tally{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .lab-tally th{background:var(--surface-2);color:var(--ink-soft);font-size:11px;text-transform:uppercase;padding:10px 12px;text-align:right;}
  .lab-tally td{padding:10px 12px;border-top:1px solid var(--line);text-align:right;}
  .lab-tally td:first-child,.lab-tally th:first-child{text-align:right;}

  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:right;background:var(--surface-2);color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;}
  th:first-child,td:first-child{text-align:center;}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAFCFD;}
  .mono{font-family:var(--mono);font-size:12px;}
  .actions-cell{display:flex;gap:6px;}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}
  .qr-thumb{width:44px;height:44px;background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .table-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .table-toolbar .left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}

  .alert-group{margin-bottom:22px;}
  .alert-group h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 10px;}
  .alert-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--kc,var(--brand));border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
  .alert-card .info b{font-family:var(--mono);}
  .alert-card .info .msg{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .alert-card .info .msg strong{color:var(--ink);}
  .ack-tag{font-size:11.5px;font-family:var(--mono);padding:2px 8px;border-radius:20px;background:var(--green-bg);color:var(--green);}
  .alert-actions{display:flex;gap:8px;flex-shrink:0;}

  .callout{background:#FFF9EC;border:1px solid #EEDBA0;border-radius:10px;padding:13px 16px;font-size:13px;color:#6B550F;margin-bottom:20px;line-height:1.65;}
  .callout b{color:#4A3A08;}
  .callout.blue{background:#EAF3F6;border-color:#BFD9E2;color:#0B4F6C;}
  .callout.blue b{color:var(--brand-dark);}
  .callout.red{background:var(--red-bg);border-color:#EAC0C3;color:#7A2126;}
  .callout.red b{color:#5C1116;}

  .modal-bg{position:fixed;inset:0;background:rgba(11,25,30,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;padding:26px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal.narrow{max-width:400px;}
  .modal h3{margin:0 0 4px;font-size:19px;}
  .modal .modal-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .form-section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:600;margin:16px 0 8px;}
  .form-section-title:first-child{margin-top:0;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.full{grid-column:1/-1;}
  .form-field.span2{grid-column:span 2;}
  .form-field label{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .form-field input,.form-field select,.form-field textarea{font-family:var(--sans);font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%;}
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:2px solid var(--brand);outline-offset:1px;background:#fff;}
  .modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;}
  .helptext{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .inline-btn{font-size:11px;color:var(--brand);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
  .ma-checklist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
  .ma-check-row{display:grid;grid-template-columns:1fr 130px 1fr;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);}
  .ma-check-row.is-fail{border-color:var(--red);background:var(--red-bg);}
  .ma-check-label{font-size:12.5px;line-height:1.4;}
  .ma-check-select{font-family:var(--sans);font-size:12.5px;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .ma-check-reason{font-family:var(--sans);font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;width:100%;}
  @media(max-width:700px){ .ma-check-row{grid-template-columns:1fr;} }

  .settings-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  .settings-card h4{margin:0 0 6px;font-size:15px;}
  .settings-card p{margin:0 0 12px;color:var(--ink-soft);font-size:13px;}
  .file-drop{border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .file-drop:hover{border-color:var(--brand);color:var(--brand);}
  .lab-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap;}
  .lab-row:last-child{border-bottom:none;}
  .lab-row input[type=text]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-family:var(--sans);}
  .lab-row .lab-id{font-family:var(--mono);font-size:11px;color:var(--ink-soft);width:52px;flex-shrink:0;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--brand-dark);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .qr-print-area{text-align:center;padding:10px 0;}
  .qr-print-area .qr-box{display:inline-flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:6px;}
  .qr-print-area .qr-box b{font-family:var(--mono);font-size:14px;}
  .qr-print-area .qr-box span{font-size:11px;color:var(--ink-soft);}
  #qrPrintSheet{display:none;}

  @media print{
    body *{visibility:hidden;}
    #qrPrintSheet, #qrPrintSheet *{visibility:visible;}
    #qrPrintSheet{display:block !important;position:absolute;left:0;top:0;width:100%;}
  }
  @media(max-width:900px){
    .shell{flex-direction:column;}
    .sidebar{position:relative;height:auto;width:100%;}
    nav{display:flex;overflow-x:auto;padding:8px;}
    .nav-btn{white-space:nowrap;}
    .main{padding:20px;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .map-layout{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <p class="eyebrow">Equipment Registry</p>
      <h1>ระบบบริหารจัดการ UPS</h1>
      <div class="sub">ภาควิชาจุลชีววิทยา · รพ.จุฬาลงกรณ์ สภากาชาดไทย</div>
    </div>
    <div class="lab-switch">
      <label>ห้องปฏิบัติการที่กำลังดู</label>
      <select id="labSwitcher"></select>
      <button class="auth-btn" id="btnQuickAddLab" style="margin-top:8px;display:none;">+ เพิ่มห้องปฏิบัติการใหม่</button>
    </div>
    <nav id="nav"></nav>
    <div class="auth-panel" id="authPanel"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<div id="qrPrintSheet"></div>

<script>
/* =========================================================
   FIREBASE / FIRESTORE CONFIG
========================================================= */
/* Fill these in from: Firebase Console > Project settings > General >
   Your apps > SDK setup and configuration. These values are meant to be
   public/client-side — real protection comes from Firestore Security
   Rules (see firestore.rules in the setup package), not from hiding this. */
const firebaseConfig = {
  apiKey: "AIzaSyAWhxKizhMGDFuSDEWVrPE2cpDl8Jn1V8M",
  authDomain: "ups-mdcu-3a6bc.firebaseapp.com",
  projectId: "ups-mdcu-3a6bc",
  storageBucket: "ups-mdcu-3a6bc.firebasestorage.app",
  messagingSenderId: "442022652746",
  appId: "1:442022652746:web:41b69ff3bdad34f101efb3",
  measurementId: "G-ND8MLSE6QJ"
};
const FS={ assets:'assets', labs:'labs', mapBgs:'map_backgrounds', settings:'app_settings' };
const SETTINGS_DOC_ID='main';
let db=null;
let hashRouteHandled=false;

const SESSION_KEY='ups_mgmt_session_v1';
const CURLAB_KEY='ups_mgmt_current_lab_v1';

let assets=[];
let labs=[];
let mapBgs={};
let settings={ qrBaseUrl:'', masterPasswordHash:null };
let session={ role:'public' };
let currentLabId=null;
let currentView='dashboard';
let selectedAssetId=null;
let selectedIds=new Set();

const DEFAULT_LABS=[
  {id:'lab1', name:'ห้องปฏิบัติการภูมิคุ้มกันวิทยา อาคารภูมิสิริฯ (PS2I) (Immunology)', defaultPw:'lab1-2569'},
  {id:'lab2', name:'ห้องปฏิบัติการแบคทีเรียวิทยา (Bacteriology)', defaultPw:'lab2-2569'},
  {id:'lab3', name:'ห้องปฏิบัติการไวรัสวิทยา (Virology)', defaultPw:'lab3-2569'},
  {id:'lab4', name:'ห้องปฏิบัติการปรสิตวิทยา (Parasitology)', defaultPw:'lab4-2569'},
  {id:'lab5', name:'ห้องปฏิบัติการมัยโคแบคทีเรีย/วัณโรค (Mycobacteriology)', defaultPw:'lab5-2569'},
  {id:'lab6', name:'ห้องปฏิบัติการราวิทยา (Mycology)', defaultPw:'lab6-2569'},
  {id:'lab7', name:'ห้องปฏิบัติการอณูชีววิทยา (Molecular Diagnostics)', defaultPw:'lab7-2569'},
];
const DEFAULT_MASTER_PW='master-2569';

/* Standard MA (annual maintenance) checklist — shared reference list used
   both on the "ความรู้เกี่ยวกับ UPS" page and as the per-asset checklist
   in the asset edit form. */
const MA_CHECKLIST_ITEMS=[
  {id:'visual', label:'ตรวจสภาพภายนอกเครื่องและแบตเตอรี่ (บวม / รั่ว / คราบสนิม)'},
  {id:'connections', label:'ตรวจความแน่นของจุดต่อสายไฟและขั้วแบตเตอรี่'},
  {id:'clean', label:'ทำความสะอาดฝุ่นภายในเครื่องด้วยผ้าแห้ง/ลมเป่า (ห้ามใช้น้ำ)'},

   PERSISTENCE — Firestore-backed, real-time across all users.
   assets/labs/mapBgs/settings are kept in sync via onSnapshot
   listeners; session + currentLabId stay local (per-browser).
========================================================= */
function loadLocalOnly(){
  try{ const rawSess=sessionStorage.getItem(SESSION_KEY); session = rawSess? JSON.parse(rawSess) : {role:'public'}; }
  catch(e){ session={role:'public'}; }
  currentLabId = localStorage.getItem(CURLAB_KEY) || null;
}
function saveSession(){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); }
function saveCurrentLab(){ localStorage.setItem(CURLAB_KEY, currentLabId); }
function uid(){ return 'a_'+Math.random().toString(36).slice(2,10); }

async function sha256(text){
  const enc=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* Runs once ever, only if app_settings/main doesn't exist yet — seeds
   default labs (with default passwords) + the transcribed sample data
   for lab1. Never re-seeds after that, even if data is later cleared
   intentionally. */
async function seedIfNeeded(){
  const settingsRef=db.collection(FS.settings).doc(SETTINGS_DOC_ID);
  const snap=await settingsRef.get();
  if(snap.exists) return;

  const masterHash=await sha256(DEFAULT_MASTER_PW);
  await settingsRef.set({ qrBaseUrl:'', masterPasswordHash:masterHash, seeded:true, seeded_at:new Date().toISOString() });

  const labBatch=db.batch();
  for(const l of DEFAULT_LABS){
    const hash=await sha256(l.defaultPw);
    labBatch.set(db.collection(FS.labs).doc(l.id), { name:l.name, passwordHash:hash, contact_name:'', contact_phone:'' });
  }
  await labBatch.commit();

  const assetBatch=db.batch();
  seedAssets().forEach(a=>{
    const { id, ...rest }=a;
    assetBatch.set(db.collection(FS.assets).doc(a.asset_id), rest);
  });
  await assetBatch.commit();
}

function attachListeners(){
  db.collection(FS.assets).onSnapshot(snap=>{
    assets=snap.docs.map(d=>Object.assign({
      lab_id:'lab1', contract:'', contract_company:'', contract_contact_name:'', contract_contact_email:'',
      ma_checklist:{}, responsible_name:'', responsible_email:'',
      acknowledge_status:'Pending', acknowledge_timestamp:null
    }, d.data(), { id:d.id }));
    render();
    if(!hashRouteHandled){ hashRouteHandled=true; handleHashRoute(); }
  }, err=>{ console.error(err); toast('เชื่อมต่อฐานข้อมูล (assets) ไม่สำเร็จ'); });

  db.collection(FS.labs).onSnapshot(snap=>{
    labs=snap.docs.map(d=>Object.assign({ contact_name:'', contact_phone:'' }, d.data(), { id:d.id }));
    if(!currentLabId) currentLabId = localStorage.getItem(CURLAB_KEY) || labs[0]?.id || null;
    if(currentLabId==='ALL' && session.role!=='master') currentLabId = labs[0]?.id || null;
    render();
  }, err=>{ console.error(err); toast('เชื่อมต่อฐานข้อมูล (labs) ไม่สำเร็จ'); });

  db.collection(FS.mapBgs).onSnapshot(snap=>{
    mapBgs={};
    snap.docs.forEach(d=>{ mapBgs[d.id]=d.data(); });
    render();
  });

  db.collection(FS.settings).doc(SETTINGS_DOC_ID).onSnapshot(doc=>{
    if(doc.exists) settings=Object.assign({ qrBaseUrl:'', masterPasswordHash:null }, doc.data());
    render();
  });
}

/* =========================================================
   DERIVED / RISK LOGIC
========================================================= */
function addYearsISO(dateStr,n){ if(!dateStr) return null; const d=new Date(dateStr); d.setFullYear(d.getFullYear()+n); return d.toISOString().slice(0,10); }
function nextBatteryDue(a){ return a.next_battery_date || addYearsISO(a.last_battery_date,2); }
function daysUntil(dateStr){ if(!dateStr) return null; const t=new Date(); t.setHours(0,0,0,0); const d=new Date(dateStr); d.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
const RISK_LABEL={red:'วิกฤต / บวม',yellow:'เฝ้าระวัง',green:'ปกติ'};
const RISK_COLOR={red:'var(--red)',yellow:'var(--yellow)',green:'var(--green)'};
function batteryAlertLevel(a){ const d=daysUntil(nextBatteryDue(a)); if(d===null) return null; if(d<=30) return {days:d,overdue:d<0}; return null; }
function maAlertLevel(a){ const d=daysUntil(a.next_ma_date); if(d===null) return null; if(d<=7) return {days:d,overdue:d<0}; return null; }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'})+' '+dt.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }

function maChecklistStats(a){
  const cl=a.ma_checklist||{};
  let pass=0, fail=0, unchecked=0;
  MA_CHECKLIST_ITEMS.forEach(item=>{
    const r=cl[item.id]?.result;
    if(r==='pass') pass++; else if(r==='fail') fail++; else unchecked++;
  });
  return {pass, fail, unchecked, total:MA_CHECKLIST_ITEMS.length};
}
function maChecklistBadge(a){
  const s=maChecklistStats(a);
  if(s.pass===0 && s.fail===0) return `<span class="helptext">ยังไม่บันทึก</span>`;
  const parts=[];
  if(s.pass) parts.push(`<span style="color:var(--green)">✓ ผ่าน ${s.pass}</span>`);
  if(s.fail) parts.push(`<span style="color:var(--red)">✕ ไม่ผ่าน ${s.fail}</span>`);
  if(s.unchecked) parts.push(`<span class="helptext">ยังไม่ตรวจ ${s.unchecked}</span>`);
  return parts.join(' · ');
}

/* =========================================================
   ALERTS VIEW
========================================================= */
function viewAlerts(){
  const scoped=getScopedAssets();
  const battery=scoped.filter(a=>batteryAlertLevel(a)).sort((a,b)=>daysUntil(nextBatteryDue(a))-daysUntil(nextBatteryDue(b)));
  const ma=scoped.filter(a=>maAlertLevel(a)).sort((a,b)=>daysUntil(a.next_ma_date)-daysUntil(a.next_ma_date));
  return `
    <div class="page-head"><div><h2>ศูนย์แจ้งเตือน</h2><p>รายการที่ใกล้ครบกำหนดเปลี่ยนแบตเตอรี่ (ล่วงหน้า 30 วัน) และบำรุงรักษาประจำปี (ล่วงหน้า 7 วัน)</p></div></div>
    <div class="callout">
      <b>หมายเหตุการทำงาน:</b> ไฟล์นี้เป็นแอปฝั่งผู้ใช้ (client-side) จึงยังไม่มีเซิร์ฟเวอร์คอยรัน Cron Job หรือส่งอีเมลอัตโนมัติจริง
      ระบบจะสแกนแจ้งเตือนทุกครั้งที่เปิดหน้านี้ ปุ่ม “ส่งอีเมลแจ้งเตือน” จะเปิดโปรแกรมอีเมลพร้อมข้อความร่างไว้ให้ (mailto)
    </div>
    <div class="alert-group"><h4>🔋 แจ้งเตือนเปลี่ยนแบตเตอรี่ (${battery.length})</h4>
      ${battery.length?battery.map(a=>alertCard(a,'battery')).join(''):`<div class="empty-state" style="padding:24px;">ไม่มีรายการใกล้ครบกำหนดในขณะนี้</div>`}
    </div>
    <div class="alert-group"><h4>🛠️ แจ้งเตือนบำรุงรักษาประจำปี (${ma.length})</h4>
      ${ma.length?ma.map(a=>alertCard(a,'ma')).join(''):`<div class="empty-state" style="padding:24px;">ไม่มีรายการใกล้ครบกำหนดในขณะนี้</div>`}
    </div>`;
}
function alertCard(a,type){
  const info=type==='battery'?batteryAlertLevel(a):maAlertLevel(a);
  const due=type==='battery'?nextBatteryDue(a):a.next_ma_date;
  const kc=info.overdue?'var(--red)':'var(--yellow)';
  const verb=type==='battery'?'เปลี่ยนแบตเตอรี่':'บำรุงรักษาประจำปี (MA)';
  const statusMsg=info.overdue?`เลยกำหนด${verb}มาแล้ว <strong>${Math.abs(info.days)} วัน</strong> (กำหนด ${fmtDate(due)})`:`ใกล้ครบกำหนด${verb}ใน <strong>${info.days} วัน</strong> (กำหนด ${fmtDate(due)})`;
  const subject=encodeURIComponent(`แจ้งเตือน${verb} — ${a.asset_id}`);
  const body=encodeURIComponent(`เรียน ${a.responsible_name||'ผู้รับผิดชอบ'}\n\nระบบแจ้งเตือน${verb}สำหรับเครื่อง UPS ดังนี้\nAsset ID: ${a.asset_id}\nห้องปฏิบัติการ: ${getLab(a.lab_id)?.name||''}\nตำแหน่ง: ${a.location}\nกำหนด: ${fmtDate(due)}\n\nกรุณาดำเนินการและกดรับทราบในระบบทะเบียน UPS\nขอบคุณครับ/ค่ะ`);
  const mailLink=a.responsible_email?`mailto:${a.responsible_email}?subject=${subject}&body=${body}`:null;
  const editable=canEditLab(a.lab_id);
  return `
    <div class="alert-card" style="--kc:${kc}">
      <div class="info">
        <div><b>${a.asset_id}</b> · ${escapeHtml(a.location)} ${currentLabId==='ALL'?`· <span class="helptext">${escapeHtml(getLab(a.lab_id)?.name||'')}</span>`:''}</div>
        <div class="msg">${statusMsg}</div>
        <div class="msg">ผู้รับผิดชอบ: ${escapeHtml(a.responsible_name)||'ยังไม่ระบุ'} ${a.acknowledge_status==='Acknowledged'?`<span class="ack-tag" style="margin-right:6px;">รับทราบแล้ว ${fmtDateTime(a.acknowledge_timestamp)}</span>`:''}</div>
      </div>
      <div class="alert-actions">
        ${mailLink?`<a class="btn btn-sm" href="${mailLink}">✉️ ส่งอีเมลแจ้งเตือน</a>`:`<span class="helptext">ไม่มีอีเมลผู้รับผิดชอบ</span>`}
        ${editable&&a.acknowledge_status!=='Acknowledged'?`<button class="btn btn-sm btn-gold" data-ack="${a.id}">กดรับทราบ</button>`:''}
      </div>
    </div>`;
}

/* =========================================================
   LOGIN MODAL
========================================================= */
function openLoginModal(){
  document.getElementById('modalBody').innerHTML=`
    <h3>เข้าสู่ระบบผู้ดูแล</h3>
    <p class="modal-sub">กรอกรหัสผ่านผู้ดูแลระบบรวม หรือรหัสผ่านผู้ดูแลของห้องปฏิบัติการของคุณ</p>
    <div class="form-field"><label>รหัสผ่าน</label><input type="password" id="f_login_pw" autofocus></div>
    <p class="helptext" id="loginError" style="color:var(--red);"></p>
    <div class="modal-foot">
      <button class="btn" id="btnCancelLogin">ยกเลิก</button>
      <button class="btn btn-primary" id="btnDoLogin">เข้าสู่ระบบ</button>
    </div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalBody').classList.add('narrow');
  document.getElementById('btnCancelLogin').onclick=closeModal;
  const pwInput=document.getElementById('f_login_pw');
  pwInput.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('btnDoLogin').onclick=doLogin;
}
async function doLogin(){
  const pw=document.getElementById('f_login_pw').value;
  if(!pw) return;
  const hash=await sha256(pw);
  if(hash===settings.masterPasswordHash){
    session={role:'master'}; saveSession(); closeModal(); render(); toast('เข้าสู่ระบบในฐานะผู้ดูแลระบบรวมแล้ว'); return;
  }
  const lab=labs.find(l=>l.passwordHash===hash);
  if(lab){
    session={role:'lab',labId:lab.id}; saveSession(); currentLabId=lab.id; saveCurrentLab(); closeModal(); render(); toast(`เข้าสู่ระบบผู้ดูแล: ${lab.name}`); return;
  }
  document.getElementById('loginError').textContent='รหัสผ่านไม่ถูกต้อง';
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); document.getElementById('modalBody').classList.remove('narrow'); }

function gatherMaChecklist(){
  const result={};
  MA_CHECKLIST_ITEMS.forEach(item=>{
    const sel=document.querySelector(`[data-check-result="${item.id}"]`);
    const reasonInput=document.querySelector(`[data-check-reason="${item.id}"]`);
    const res=sel?sel.value:'';
    const reason=reasonInput?reasonInput.value.trim():'';
    if(res || reason) result[item.id]={result:res, reason};
  });
  return result;
}
function saveAssetFromModal(id){
  const assetIdVal=document.getElementById('f_asset_id').value.trim();
  if(!assetIdVal){ toast('กรุณากรอก Asset ID'); return; }
  const dup=assets.find(x=>x.asset_id===assetIdVal && x.id!==id);
  if(dup){ toast('Asset ID นี้มีอยู่แล้วในระบบ'); return; }
  const labIdVal=document.getElementById('f_lab_id').value;
  if(!canEditLab(labIdVal)){ toast('คุณไม่มีสิทธิ์บันทึกข้อมูลของห้องนี้'); return; }

  const data={
    asset_id:assetIdVal, lab_id:labIdVal,
    floor:document.getElementById('f_floor').value.trim(),
    location:document.getElementById('f_location').value.trim(),
    load_va:document.getElementById('f_load').value.trim(),
    brand:document.getElementById('f_brand').value.trim(),
    ups_rating:document.getElementById('f_rating').value.trim(),
    serial_number:document.getElementById('f_serial').value.trim(),
    contract:document.getElementById('f_contract').value.trim(),
    contract_company:document.getElementById('f_contract_company').value.trim(),
    contract_contact_name:document.getElementById('f_contract_contact_name').value.trim(),
    contract_contact_email:document.getElementById('f_contract_contact_email').value.trim(),
    install_year_text:document.getElementById('f_install').value.trim(),
    duration_years:document.getElementById('f_duration').value.trim(),
    estimated_lifespan:document.getElementById('f_lifespan').value.trim(),
    battery_size:document.getElementById('f_batt_size').value.trim(),
    battery_qty:document.getElementById('f_batt_qty').value.trim(),
    risk_status:document.getElementById('f_risk').value,
    last_battery_date:document.getElementById('f_battery_date').value||null,
    next_battery_date:document.getElementById('f_next_battery').value||null,
    next_ma_date:document.getElementById('f_ma').value||null,
    ma_checklist: gatherMaChecklist(),
    responsible_name:document.getElementById('f_resp_name').value.trim(),
    responsible_email:document.getElementById('f_resp_email').value.trim(),
    x:clamp(Number(document.getElementById('f_x').value)||50,0,100),
    y:clamp(Number(document.getElementById('f_y').value)||50,0,100),
    notes:document.getElementById('f_notes').value.trim(),
  };
  saveAssetToFirestore(id, assetIdVal, data);
}
async function saveAssetToFirestore(id, assetIdVal, data){
  try{
    if(id){
      if(assetIdVal!==id){
        // Asset ID changed — Firestore doc IDs are immutable, so move to a new doc.
        const original=assets.find(x=>x.id===id)||{};
        const merged=Object.assign({}, original, data);
        delete merged.id;
        await db.collection(FS.assets).doc(id).delete();
        await db.collection(FS.assets).doc(assetIdVal).set(merged);
      } else {
        await db.collection(FS.assets).doc(id).update(data);
      }
      toast('บันทึกการแก้ไขเรียบร้อย');
    } else {
      await db.collection(FS.assets).doc(assetIdVal).set({ acknowledge_status:'Pending', acknowledge_timestamp:null, ...data });
      toast('เพิ่มเครื่อง UPS เรียบร้อย');
    }
    closeModal();
  }catch(e){ console.error(e); toast('บันทึกไม่สำเร็จ — ตรวจสอบการเชื่อมต่อฐานข้อมูล'); }
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

function printQrLabels(ids){
  const sheet=document.getElementById('qrPrintSheet');
  sheet.innerHTML=ids.map(id=>{
    const a=assets.find(x=>x.id===id); if(!a) return '';
    return `<div style="display:inline-block;text-align:center;border:1px solid #ccc;border-radius:8px;padding:14px 18px;margin:8px;">
      <div id="qrp_${a.id}"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:6px;">${escapeHtml(a.asset_id)}</div>
      <div style="font-size:11px;color:#555;">${escapeHtml(a.location)}</div>
    </div>`;
  }).join('');

function handleHashRoute(){
  const m=location.hash.match(/asset=([^&]+)/);
  if(!m) return;
  const assetId=decodeURIComponent(m[1]);
  const a=assets.find(x=>x.asset_id===assetId);
  if(!a) return;
  currentLabId=a.lab_id; saveCurrentLab(); currentView='assets'; render();
  if(canEditLab(a.lab_id)) openAssetModal(a.id);
  else { selectedAssetId=a.id; currentView='dashboard'; render(); toast('เข้าสู่ระบบผู้ดูแลห้องนี้เพื่อแก้ไขข้อมูลเครื่องนี้'); }
}

function exportSelectedToExcel(){
  const rows=assets.filter(a=>selectedIds.has(a.id));
  if(!rows.length){ toast('กรุณาเลือกอย่างน้อย 1 รายการ'); return; }
  const header=['ลำดับ','ห้องปฏิบัติการ','Asset ID','ชั้น','สถานที่','โหลดจ่ายใช้งาน','ยี่ห้อ UPS','ขนาด UPS (Rating)','หมายเลขเครื่อง','สัญญา','บริษัท','ผู้รับผิดชอบ (บริษัท)','Email ผู้รับผิดชอบ','ปีที่ติดตั้ง','ระยะเวลาการใช้งาน','ประมาณการอายุการใช้งาน','แบตเตอรี่ ขนาด','แบตเตอรี่ จำนวน','วันที่เปลี่ยนแบต','วันที่เปลี่ยนครั้งต่อไป','กำหนด MA ถัดไป','ผลตรวจ MA (ผ่าน/ไม่ผ่าน/ยังไม่ตรวจ)','รายการที่ไม่ผ่าน + เหตุผล','สถานะความเสี่ยง','ผู้รับผิดชอบ','หมายเหตุ'];
  const data=rows.map((a,i)=>{
    const s=maChecklistStats(a);
    const fails=MA_CHECKLIST_ITEMS.filter(item=>a.ma_checklist?.[item.id]?.result==='fail')
      .map(item=>`${item.label}: ${a.ma_checklist[item.id].reason||'(ไม่ระบุเหตุผล)'}`).join(' | ');
    return [i+1, getLab(a.lab_id)?.name||a.lab_id, a.asset_id, a.floor, a.location, a.load_va, a.brand, a.ups_rating, a.serial_number,
    a.contract, a.contract_company, a.contract_contact_name, a.contract_contact_email, a.install_year_text, a.duration_years, a.estimated_lifespan, a.battery_size, a.battery_qty,
    fmtDate(a.last_battery_date), fmtDate(nextBatteryDue(a)), fmtDate(a.next_ma_date), `${s.pass}/${s.fail}/${s.unchecked}`, fails, RISK_LABEL[a.risk_status], a.responsible_name, a.notes];
  });
  const wsData=[['Summary for Thermography Inspection'],[], header, ...data];
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:header.length-1}}];
  ws['!cols']=header.map(h=>({wch: h.length>14?22:14}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'UPS Register');
  XLSX.writeFile(wb, `ups_register_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast(`ส่งออก ${rows.length} รายการเป็น Excel แล้ว`);
}

    try{ await db.collection(FS.settings).doc(SETTINGS_DOC_ID).set({masterPasswordHash: await sha256(pw)},{merge:true}); toast('เปลี่ยนรหัสผ่านผู้ดูแลระบบรวมแล้ว'); }
    catch(e){ toast('บันทึกไม่สำเร็จ'); }
  });
  document.querySelectorAll('[data-save-lab]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const labId=btn.dataset.saveLab;
    const newName=document.querySelector(`[data-lab-name="${labId}"]`).value.trim();
    const newPw=document.querySelector(`[data-lab-newpw="${labId}"]`).value;
    const updates={};
    if(newName) updates.name=newName;
    if(newPw){ if(newPw.length<4){ toast('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'); return; } updates.passwordHash=await sha256(newPw); }
    if(!Object.keys(updates).length) return;
    try{ await db.collection(FS.labs).doc(labId).update(updates); toast('บันทึกข้อมูลห้องแล้ว'); }
    catch(e){ toast('บันทึกไม่สำเร็จ'); }
  }));
  document.querySelectorAll('[data-del-lab]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const labId=btn.dataset.delLab; const lab=getLab(labId);
    const count=assets.filter(a=>a.lab_id===labId).length;
    if(!confirm(`ยืนยันลบห้อง “${lab.name}”? ${count?`มีเครื่อง UPS ${count} รายการในห้องนี้จะถูกลบไปด้วย`:''} การกระทำนี้ย้อนกลับไม่ได้`)) return;
    try{
      const snap=await db.collection(FS.assets).where('lab_id','==',labId).get();
      const batch=db.batch();
      snap.forEach(d=>batch.delete(d.ref));
      batch.delete(db.collection(FS.labs).doc(labId));
      batch.delete(db.collection(FS.mapBgs).doc(labId));
      await batch.commit();
      if(currentLabId===labId){ currentLabId=labs.find(l=>l.id!==labId)?.id||null; saveCurrentLab(); }
      toast('ลบห้องปฏิบัติการแล้ว');
    }catch(e){ toast('ลบไม่สำเร็จ'); }
  }));
  document.getElementById('btnAddLab')?.addEventListener('click', async ()=>{
    const name=document.getElementById('f_new_lab_name').value.trim();
    if(!name){ toast('กรุณาระบุชื่อห้องปฏิบัติการ'); return; }
    await addNewLab(name);
    toast('เพิ่มห้องปฏิบัติการแล้ว (รหัสผ่านเริ่มต้น: lab-2569)');
  });

  renderQrThumbnails();
}

function startDrag(e,pin,asset){
  e.preventDefault();
  const canvas=document.getElementById('mapCanvas'); const rect=canvas.getBoundingClientRect();
  pin.dataset.dragged='0';
  function move(ev){
    pin.dataset.dragged='1';
    const point=ev.touches?ev.touches[0]:ev;
    let x=((point.clientX-rect.left)/rect.width)*100, y=((point.clientY-rect.top)/rect.height)*100;
    x=clamp(x,0,100); y=clamp(y,0,100);
    pin.style.left=x+'%'; pin.style.top=y+'%';
    asset._pendingX=x; asset._pendingY=y;
  }
  function up(){
    if(asset._pendingX!==undefined){
      const nx=Math.round(asset._pendingX), ny=Math.round(asset._pendingY);
      delete asset._pendingX; delete asset._pendingY;
      db.collection(FS.assets).doc(asset.id).update({x:nx, y:ny}).catch(()=>toast('บันทึกตำแหน่งไม่สำเร็จ'));
    }
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up);
  }
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);
}

/* Downscale + compress an uploaded floor-plan image client-side before
   storing it as a Firestore document (1 MiB per-document limit). */
function resizeImageDataUrl(file, maxDim=1600, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>maxDim||height>maxDim){
          const scale=maxDim/Math.max(width,height);
          width=Math.round(width*scale); height=Math.round(height*scale);
        }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

========================================================= */
function escapeHtml(str){ if(str===undefined||str===null) return ''; return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2800); }

      (ดูคำแนะนำในคู่มือ setup ที่แนบมา)<br><span class="mono" style="font-size:11px;">${escapeHtml(e.message||String(e))}</span></div>`;
  }
}
