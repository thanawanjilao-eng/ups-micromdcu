name: Daily UPS Reminder Emails

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Bangkok
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'อีเมลสำหรับส่งทดสอบ 1 ฉบับ (เว้นว่างไว้ = รันตรวจสอบและส่งแจ้งเตือนตามปกติ)'
        required: false
        default: ''

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: node scripts/send-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
